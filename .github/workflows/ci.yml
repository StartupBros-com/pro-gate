name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: trusted check
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Provision pinned CI tools
        run: ./scripts/provision-ci-tools.sh
      - name: Validate data and shell files
        run: |
          find . -path './.git' -prune -o -name '*.json' -print -exec jq empty {} \;
          find . -path './.git' -prune -o \( -name '*.yaml' -o -name '*.yml' \) -print -exec yq eval '.' {} \; >/dev/null
          find . -path './.git' -prune -o -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
      # A version bump IS a release: require its customer copy here, where a human can still
      # fix it (#69 gate r2 P1). Blocking belongs on the PR, never on the release train — that
      # job also promotes the runtime, so failing there over prose would leave a tagged release
      # customers cannot install. Without this gate the auto-notes fallback in
      # publish-runtime-release.sh silently ships branch names, which is how v0.31.0 and
      # v0.31.1 announced "governor-rounds" and "memo-crossbind".
      - name: Require customer-ready notes for a version bump
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          notes="docs/release-notes/v$version.md"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version already tagged; not a new release in this PR."
            exit 0
          fi
          if [ ! -s "$notes" ]; then
            echo "::error title=Missing release notes::VERSION is $version but $notes does not exist. Write it (see docs/RELEASE-NOTES-TEMPLATE.md) — without it the release publishes auto-generated PR titles to customers."
            exit 1
          fi
          ./scripts/check-release-notes.sh "$notes"
      - name: Run tests
        run: |
          bash tests/engine.test.sh
          bash tests/daemon-reload.test.sh
          bash tests/autoupdate.test.sh
          bash tests/browser-launch.test.sh
          node --test tests/cdp-salvage.test.mjs
          bash tests/distribution.test.sh
          bash tests/release-train.test.sh
          bash tests/release-assets.test.sh

  public-pr-check:
    name: public PR data check
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.repo.fork != false)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out untrusted pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Parse plugin manifest without repository code
        run: jq empty .claude-plugin/plugin.json
