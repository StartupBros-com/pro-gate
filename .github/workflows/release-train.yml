name: Release train

on:
  release:
    types: [published, edited]

permissions:
  contents: read

concurrency:
  group: release-train-pro-gate
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.release.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release commit
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commit on protected default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH"
      # AFTER the ancestry check, never before (#69 gate P0): this executes a script from the
      # CHECKED-OUT TAG, so running it earlier would let anyone able to push a tag execute
      # arbitrary code in a job that later handles the marketplace deploy key and the
      # announcement secret — persisting BASH_ENV/PATH to survive into those steps. Every
      # tag-sourced executable must sit below the proof that the tag descends from protected
      # main. Warn-only: promote/announce also publish the runtime, so failing on imperfect
      # PROSE would leave a tagged release customers cannot install. Blocking enforcement
      # lives in PR CI, where a human can still fix it cheaply.
      - name: Check release notes are customer-ready
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if ! printf '%s' "$RELEASE_NOTES" | ./scripts/check-release-notes.sh -; then
            echo "::warning title=Release notes are not customer-ready::The announcement will fall back to auto-generated PR titles. Edit the release body (see docs/RELEASE-NOTES-TEMPLATE.md)."
          fi
      - name: Provision pinned CI tools
        run: ./scripts/provision-ci-tools.sh

      - name: Resolve latest stable release
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_id="$(./scripts/latest-stable-release.sh "$GITHUB_REPOSITORY")"
          test -n "$latest_id"
          echo "id=$latest_id" >> "$GITHUB_OUTPUT"

      - name: Download runtime release assets
        if: github.event.release.prerelease == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern 'pro-gate-runtime-*'

      - name: Check out marketplace
        if: github.event.release.prerelease == false
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          repository: StartupBros-com/hov-marketplace
          ssh-key: ${{ secrets.HOV_MARKETPLACE_DEPLOY_KEY }}
          path: hov-marketplace
          fetch-depth: 0

      - name: Configure marketplace git identity
        if: github.event.release.prerelease == false
        working-directory: hov-marketplace
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Promote release
        env:
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: pro-gate
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          LATEST_STABLE_ID: ${{ steps.stable.outputs.id }}
          SOURCE_ROOT: ${{ github.workspace }}
          ASSET_DIR: ${{ github.workspace }}/release-assets
          MARKETPLACE_DIR: ${{ github.workspace }}/hov-marketplace
          MARKETPLACE_VALIDATION_MODE: ${{ vars.HOV_MARKETPLACE_VALIDATION_MODE || 'syntax' }}
          # Promotion remains local for backward-compatible marketplace updates.
          # The dependent reusable job owns the one Discord post via OIDC.
          PROMOTE_ONLY: true
        run: |
          source_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          export SOURCE_SHA="$source_sha"
          ./scripts/release-train.sh

  announce:
    name: Announce via canonical OIDC train
    needs: promote
    if: github.event.release.draft == false && github.event.release.prerelease == false && needs.promote.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: StartupBros-com/hov-marketplace/.github/workflows/hov-tool-drop-announce.yml@c981b872ebf650805200ad72c8b7142232f8b3f6
