name: Release train

on:
  release:
    types: [published, edited]

permissions:
  contents: read

concurrency:
  group: release-train-pro-gate
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.release.draft == false
    runs-on: ubuntu-24.04
    outputs:
      announce: ${{ steps.release-train.outputs.announce }}
    steps:
      # Historical release edits must execute today's protected verifier, not
      # whatever shell code the historical tag happened to contain.
      - name: Check out protected default branch
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch and prove the release source is on the protected branch
        id: release-source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH"
          release_source="$RUNNER_TEMP/release-source"
          test ! -e "$release_source"
          git worktree add --detach "$release_source" "$release_sha"
          test "$(git -C "$release_source" rev-parse HEAD)" = "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      # The tag worktree above is DATA ONLY: release-train.sh reads its version,
      # plugin manifest, and tag identity through SOURCE_ROOT, but every command
      # below is from the protected default-branch checkout in GITHUB_WORKSPACE.
      # This preserves the ancestry proof while ensuring an edited historical
      # release always receives the current verifier and policy.
      - name: Check release notes are customer-ready
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if ! printf '%s' "$RELEASE_NOTES" | ./scripts/check-release-notes.sh -; then
            echo "::warning title=Release notes are not customer-ready::The announcement will fall back to auto-generated PR titles. Edit the release body (see docs/RELEASE-NOTES-TEMPLATE.md)."
          fi
      - name: Provision pinned CI tools
        run: ./scripts/provision-ci-tools.sh

      - name: Resolve latest stable release
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_id="$(./scripts/latest-stable-release.sh "$GITHUB_REPOSITORY")"
          test -n "$latest_id"
          echo "id=$latest_id" >> "$GITHUB_OUTPUT"

      - name: Download runtime release assets
        if: github.event.release.prerelease == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern 'pro-gate-runtime-*'

      - name: Verify release distribution and decide announcement
        id: release-train
        env:
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: pro-gate
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          LATEST_STABLE_ID: ${{ steps.stable.outputs.id }}
          SOURCE_ROOT: ${{ runner.temp }}/release-source
          SOURCE_SHA: ${{ steps.release-source.outputs.sha }}
          ASSET_DIR: ${{ github.workspace }}/release-assets
          # Read-only: this token fetches hov-marketplace's public
          # marketplace.json plus release metadata to verify distribution. It
          # has no marketplace write path or cross-repository write grant.
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-train.sh

  announce:
    name: Announce via canonical OIDC train
    needs: verify
    if: github.event.release.draft == false && github.event.release.prerelease == false && needs.verify.result == 'success' && needs.verify.outputs.announce == 'true'
    permissions:
      contents: read
      id-token: write
    uses: StartupBros-com/hov-marketplace/.github/workflows/hov-tool-drop-announce.yml@08f7d22f3a5b59b1658ab2e96a20d0d3c352869c
